# Build bản đầy đủ và đưa lên GitHub Pages mỗi khi push lên main (web dùng cá nhân).
# Lint hoặc test lỗi thì dừng, không deploy.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ một lần deploy chạy cùng lúc; lần mới hủy lần cũ đang chờ.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Bản đầy đủ (có ngữ pháp N4–N1). Mã mở khóa 4 số lấy từ secret; không có secret thì không hỏi mã.
          VITE_UNLOCK_CODE: ${{ secrets.VITE_UNLOCK_CODE }}

      - name: Không có chuỗi giống API key trong repo và dist
        run: npm run check:secrets

      - name: Kiểm tra dist
        run: |
          for l in n4 n3 n2 n1; do test -f "dist/data/grammar/$l.json" || { echo "::error::Thiếu dist/data/grammar/$l.json"; exit 1; }; done
          test -f dist/404.html
          test -f dist/sw.js
          test -f dist/robots.txt
          grep -q 'name="robots" content="noindex, nofollow"' dist/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
